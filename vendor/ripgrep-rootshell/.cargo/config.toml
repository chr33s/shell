# Cross-compilation settings for iOS targets.
# Environment variables (SDKROOT, IOS_SYSTEM_FRAMEWORK_PATH, etc.)
# are set by the build orchestrator (xcfs/Sources/build/main.swift).

[target.aarch64-apple-ios]
rustflags = ["-C", "link-arg=-miphoneos-version-min=14.0"]

[target.aarch64-apple-ios-sim]
rustflags = ["-C", "link-arg=-mios-simulator-version-min=14.0"]
