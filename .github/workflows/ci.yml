name: CI

# The iOS target and the Watch target are built separately, the shared protocol
# package is tested on its own, and the broker and host daemon get their own
# integration runs (spec.watch.md section 18).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  ios:
    name: iOS app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: ./scripts/build.sh
      - name: Test
        run: ./scripts/test.sh

  watch:
    name: Watch app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: ./scripts/build-watch.sh
      - name: Test
        run: ./scripts/test-watch.sh

  control:
    name: Control protocol, broker, and host
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Protocol package
        working-directory: Packages/ShellControlCore
        run: swift test
      - name: Broker
        working-directory: services/shell-control
        run: swift test
      - name: Host daemon and CLI
        working-directory: cmd
        run: swift test
